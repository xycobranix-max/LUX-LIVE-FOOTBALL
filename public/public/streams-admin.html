
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b0a">
    <title>LUX LIVE TV | Stream Manager</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        body { background:#070b0a; color:#fff; font-family:Arial,sans-serif; }
        .stream-wrap { max-width:1000px; margin:auto; padding:22px; }
        .stream-panel { background:#101714; padding:20px; border-radius:14px; margin:18px 0; }
        .stream-panel h2 { color:#b8ff35; }
        .stream-form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .stream-form input,.stream-form select,.stream-form textarea {
            width:100%; padding:13px; border-radius:8px;
            border:1px solid #344238; background:#17221c;
            color:white; box-sizing:border-box;
        }
        .stream-form textarea { grid-column:1/-1; min-height:85px; }
        .stream-form button,.stream-actions button {
            padding:12px 16px; border:0; border-radius:8px;
            background:#b8ff35; color:#101714; font-weight:bold;
            cursor:pointer;
        }
        .stream-form button { grid-column:1/-1; }
        .stream-item { background:#17221c; padding:16px; border-radius:10px; margin:12px 0; }
        .stream-item h3 { margin-top:0; }
        .stream-actions { display:flex; flex-wrap:wrap; gap:8px; }
        .stream-actions button.danger { background:#e34b4b; color:white; }
        .stream-actions button.secondary { background:#344238; color:white; }
        .stream-status { color:#b8ff35; font-weight:bold; }
        .back-link { color:#b8ff35; text-decoration:none; }
        @media(max-width:600px) {
            .stream-form { grid-template-columns:1fr; }
            .stream-form textarea,.stream-form button { grid-column:1; }
        }
    </style>
</head>
<body>
<div class="stream-wrap">
    <a class="back-link" href="/admin.html">← Back to Admin Dashboard</a>

    <h1>📡 LUX LIVE TV</h1>
    <p>Manage authorised external broadcasts and future owned streams.</p>

    <section class="stream-panel" id="loginPanel">
        <h2>Admin Access</h2>
        <p>Sign in through your existing admin dashboard first.</p>
        <a class="back-link" href="/admin.html">Open Admin Login</a>
    </section>

    <section class="stream-panel" id="managerPanel" hidden>
        <h2>Add a Live Stream</h2>

        <form id="streamForm" class="stream-form">
            <input name="title" placeholder="Stream title *" required>
            <input name="competition" placeholder="Competition">

            <input name="home_team" placeholder="Home team">
            <input name="away_team" placeholder="Away team">

            <input name="source_url" type="url"
                placeholder="Authorised YouTube URL *" required>

            <input name="scheduled_at" type="datetime-local">

            <select name="status">
                <option value="scheduled">Scheduled</option>
                <option value="live">Live now</option>
                <option value="ended">Ended</option>
            </select>

            <select name="is_published">
                <option value="false">Save as draft</option>
                <option value="true">Publish publicly</option>
            </select>

            <textarea name="description" placeholder="Stream description"></textarea>

            <button type="submit">ADD STREAM</button>
        </form>
        <p id="formMessage"></p>
    </section>

    <section class="stream-panel" id="streamsPanel" hidden>
        <h2>Stream Library</h2>
        <button onclick="loadStreams()">REFRESH STREAMS</button>
        <div id="streamList"></div>
    </section>
</div>

<script>
const token = sessionStorage.getItem("lux_admin_token");

const loginPanel = document.getElementById("loginPanel");
const managerPanel = document.getElementById("managerPanel");
const streamsPanel = document.getElementById("streamsPanel");
const streamList = document.getElementById("streamList");
const form = document.getElementById("streamForm");
const formMessage = document.getElementById("formMessage");

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;",
        '"':"&quot;", "'":"&#39;"
    })[char]);
}

async function adminRequest(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            "Content-Type":"application/json",
            "Authorization":`Bearer ${token}`,
            ...(options.headers || {})
        }
    });

    const result = await response.json();

    if (!response.ok) {
        throw new Error(result.message || "Request failed");
    }

    return result;
}

async function loadStreams() {
    streamList.textContent = "Loading streams...";

    try {
        const result = await adminRequest("/api/admin/live-streams");

        if (!result.streams.length) {
            streamList.textContent = "No streams added yet.";
            return;
        }

        streamList.innerHTML = result.streams.map(stream => `
            <article class="stream-item">
                <h3>${escapeHTML(stream.title)}</h3>
                <p>${escapeHTML(stream.home_team || "")}
                ${stream.home_team && stream.away_team ? " vs " : ""}
                ${escapeHTML(stream.away_team || "")}</p>
                <p>${escapeHTML(stream.competition || "Football")}</p>
                <p>Status: <span class="stream-status">${escapeHTML(stream.status)}</span></p>
                <p>Publication: ${stream.is_published ? "Published" : "Draft"}</p>
                <div class="stream-actions">
                    <button onclick="changeStatus('${stream.id}','live')">GO LIVE</button>
                    <button class="secondary" onclick="changeStatus('${stream.id}','scheduled')">SCHEDULE</button>
                    <button class="secondary" onclick="togglePublish('${stream.id}',${!stream.is_published})">
                        ${stream.is_published ? "UNPUBLISH" : "PUBLISH"}
                    </button>
                    <button class="danger" onclick="deleteStream('${stream.id}')">DELETE</button>
                </div>
            </article>
        `).join("");
    } catch (error) {
        streamList.textContent = error.message;
    }
}

form.addEventListener("submit", async event => {
    event.preventDefault();

    const values = Object.fromEntries(new FormData(form).entries());

    values.is_published = values.is_published === "true";
    values.scheduled_at = values.scheduled_at
        ? new Date(values.scheduled_at).toISOString()
        : null;

    formMessage.textContent = "Saving stream...";

    try {
        await adminRequest("/api/admin/live-streams", {
            method:"POST",
            body:JSON.stringify(values)
        });

        form.reset();
        formMessage.textContent = "Stream added successfully!";
        await loadStreams();
    } catch (error) {
        formMessage.textContent = error.message;
    }
});

async function changeStatus(id, status) {
    try {
        await adminRequest(`/api/admin/live-streams/${id}`, {
            method:"PATCH",
            body:JSON.stringify({status})
        });
        await loadStreams();
    } catch (error) {
        alert(error.message);
    }
}

async function togglePublish(id, is_published) {
    try {
        await adminRequest(`/api/admin/live-streams/${id}`, {
            method:"PATCH",
            body:JSON.stringify({is_published})
        });
        await loadStreams();
    } catch (error) {
        alert(error.message);
    }
}

async function deleteStream(id) {
    if (!confirm("Delete this stream permanently?")) return;

    try {
        await adminRequest(`/api/admin/live-streams/${id}`, {
            method:"DELETE"
        });
        await loadStreams();
    } catch (error) {
        alert(error.message);
    }
}

if (token) {
    loginPanel.hidden = true;
    managerPanel.hidden = false;
    streamsPanel.hidden = false;
    loadStreams();
}
</script>
</body>
</html>
