
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d0a">
    <title>Reset Password | LUX LIVE FOOTBALL</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #080d0a;
            color: #f2f6f0;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: #111a14;
            border: 1px solid rgba(184,255,53,.2);
            border-radius: 16px;
        }

        h1 { font-size: 29px; margin-bottom: 8px; }
        h1 span { color: #b8ff35; }

        p { color: #91a092; line-height: 1.6; font-size: 14px; }

        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(184,255,53,.2);
            background: #080d0a;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #b8ff35;
            color: #080d0a;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: .5; cursor: wait; }

        #message { margin-top: 16px; }
        a { color: #b8ff35; }
    </style>
</head>
<body>

<div class="card">
    <h1>LUX <span>PASSWORD RESET</span></h1>
    <p>Choose a new password for your administrator account.</p>

    <form id="resetForm">
        <label for="newPassword">NEW PASSWORD</label>
        <input id="newPassword" type="password"
            minlength="8" required autocomplete="new-password"
            placeholder="At least 8 characters">

        <label for="confirmPassword">CONFIRM PASSWORD</label>
        <input id="confirmPassword" type="password"
            minlength="8" required autocomplete="new-password"
            placeholder="Enter password again">

        <button id="resetButton" type="submit">
            UPDATE PASSWORD
        </button>
    </form>

    <p id="message" role="status">Checking your recovery link...</p>
    <p><a href="/admin.html">Return to Admin Login</a></p>
</div>

<script type="module">
    import { createClient } from
        "https://esm.sh/@supabase/supabase-js@2";

    // Replace these two placeholders with the matching
    // values from your Render environment variables.
    const SUPABASE_URL = "https://vojfqxelncuzrggobguo.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Y5rIJdznB5DDOtghCWphFA_IGTe2EEA";

    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("resetButton");

    let recoveryReady = false;

    function showMessage(text, success = false) {
        message.textContent = text;
        message.style.color = success ? "#b8ff35" : "#ff7777";
    }

    async function checkRecoverySession() {
        try {
            const { data, error } = await supabase.auth.getSession();

            if (error) throw error;

            if (!data.session) {
                showMessage(
                    "Recovery session not found. Request a new password recovery email."
                );
                return;
            }

            recoveryReady = true;
            showMessage("Recovery link verified. You can now set a new password.", true);

        } catch (error) {
            showMessage(error.message || "Unable to verify recovery link.");
        }
    }

    supabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
            recoveryReady = true;
            showMessage("Recovery link verified. Enter your new password.", true);
        }
    });

    await checkRecoverySession();

    form.addEventListener("submit", async event => {
        event.preventDefault();

        if (!recoveryReady) {
            showMessage("Your recovery link is not valid. Request a new one.");
            return;
        }

        const password = document.getElementById("newPassword").value;
        const confirmation = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            showMessage("Your password must contain at least 8 characters.");
            return;
        }

        if (password !== confirmation) {
            showMessage("The passwords do not match.");
            return;
        }

        button.disabled = true;
        button.textContent = "UPDATING...";

        try {
            const { error } = await supabase.auth.updateUser({
                password
            });

            if (error) throw error;

            await supabase.auth.signOut();

            recoveryReady = false;
            form.reset();

            showMessage(
                "Password updated successfully! You can now sign in to LUX Admin.",
                true
            );

        } catch (error) {
            showMessage(error.message || "Password update failed.");
        } finally {
            button.disabled = false;
            button.textContent = "UPDATE PASSWORD";
        }
    });
</script>

</body>
</html>
